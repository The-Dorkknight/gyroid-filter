[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gyroid-filter"
version = "0.1.0"
description = "Pick a face or cylinder and make it open-cell gyroid for fillable carbon filters (Cura, PrusaSlicer, OrcaSlicer). Work in progress."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Matthew Armstrong", email = "335691363+The-Dorkknight@users.noreply.github.com" }]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Environment :: Web Environment", "Programming Language :: Python :: 3", "Topic :: Printing"]

[project.urls]
Homepage = "https://github.com/The-Dorkknight/gyroid-filter"

[project.scripts]
gyroid-filter = "gyroid_filter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gyroid_filter = ["web/*", "web/vendor/*"]
